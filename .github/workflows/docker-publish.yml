name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Define os serviços que possuem Dockerfile
        service: [frontend, backend]

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Build da imagem (${{ matrix.service }})
        run: |
          docker build -t techedu-${{ matrix.service }}:${{ github.sha }} ./${{ matrix.service }}

      - name: Teste básico (Simulação)
        run: |
          echo "Rodando testes em ${{ matrix.service }}..."
          # Aqui você poderia adicionar um comando como: 
          # docker run techedu-${{ matrix.service }}:${{ github.sha }} npm test